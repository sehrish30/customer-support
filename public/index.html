<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SupportPilot AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">Portfolio Demo</p>
        <h1>SupportPilot AI</h1>
        <p class="subtitle">
          Hybrid support assistant powered by knowledge-base retrieval and agentic LLM routing.
        </p>
      </header>

      <section class="card" aria-label="Search panel">
        <form id="search-form" class="search-form">
          <label for="query">Ask a support question</label>
          <textarea
            id="query"
            name="query"
            rows="4"
            placeholder="Example: How can I change my billing plan and when does the update take effect?"
            required
          ></textarea>
          <button id="submit-btn" type="submit">Run Search</button>
        </form>
      </section>

      <section class="card results" aria-live="polite">
        <div class="results-head">
          <h2>Answer</h2>
          <span id="status-pill" class="pill">Idle</span>
        </div>
        <p id="answer" class="answer muted">Your response will appear here.</p>

        <h3>Sources</h3>
        <ul id="sources" class="sources-list">
          <li class="muted">No sources yet.</li>
        </ul>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
